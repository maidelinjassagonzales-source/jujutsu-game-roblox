name: TurboPapu mod build

on:
  push:
    paths:
      - "turbopapu-mod/**"
      - ".github/workflows/turbopapu-mod.yml"
  pull_request:
    paths:
      - "turbopapu-mod/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: turbopapu-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: turbopapu-mod
          path: turbopapu-mod/build/libs/*.jar
